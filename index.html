<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habit Tracker | Your Success Starts Here</title>
<meta name="theme-color" content="#090b0a">
<meta name="description" content="Build consistent habits, track your progress, and celebrate every small win.">
<style>

:root{
  --bg:#090b0a;
  --surface:#141816;
  --surface-2:#1c211e;
  --surface-3:#252c27;
  --gold:#d8b45a;
  --gold-soft:#f0d58d;
  --green:#a9e6b5;
  --green-strong:#83d99a;
  --text:#f1f3f0;
  --muted:#a2aaa4;
  --line:#303a33;
  --danger:#d8b45a;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(ellipse at 50% -15%,rgba(169,230,181,.10),transparent 38%),
    radial-gradient(ellipse at 100% 15%,rgba(216,180,90,.07),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased
}
button,input,textarea{font:inherit}
button{ -webkit-tap-highlight-color:transparent }
.wrap{max-width:1060px;margin:0 auto;padding:24px 20px 30px}
.banner{
  text-align:center;font-size:11px;letter-spacing:4px;color:var(--gold);
  font-weight:800;margin:2px 0 12px
}
.saved{display:block;text-align:center;font-size:11px;color:var(--green);opacity:.65;transition:.3s;margin-bottom:12px;min-height:16px}
header{
  position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:18px;padding:22px 24px;margin-bottom:20px;
  border:1px solid rgba(216,180,90,.35);border-radius:22px;
  background:linear-gradient(135deg,rgba(169,230,181,.08),rgba(216,180,90,.06) 55%,rgba(255,255,255,.015));
  box-shadow:0 18px 50px rgba(0,0,0,.24);text-align:center;overflow:hidden
}
header:after{content:"";position:absolute;inset:auto 12% 0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),var(--green),transparent);opacity:.7}
header h2{margin:0;font-size:clamp(17px,2.6vw,25px);line-height:1.25;color:var(--text);font-weight:750}
header h2:first-child{color:var(--green)}
header h2:last-child{color:var(--gold-soft)}
.cap{font-size:clamp(38px,6vw,58px);filter:drop-shadow(0 7px 18px rgba(216,180,90,.18));animation:float 3.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.btn{
  background:var(--surface-2);color:var(--gold-soft);border:1px solid rgba(216,180,90,.6);
  border-radius:12px;padding:11px 16px;font-size:14px;font-weight:650;cursor:pointer;
  transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease
}
.btn:hover{background:rgba(216,180,90,.14);border-color:var(--gold);box-shadow:0 5px 18px rgba(216,180,90,.09)}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.d:focus-visible,.langs button:focus-visible,.nav button:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.main-btn{width:100%;margin-top:16px;font-size:16px;font-weight:750;min-height:48px}
#create{background:linear-gradient(100deg,rgba(169,230,181,.13),rgba(216,180,90,.13));border-color:rgba(169,230,181,.55);color:var(--green)}
#panel{display:none;margin-top:12px;gap:10px;flex-direction:column;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
#panel.open{display:flex;animation:panelIn .22s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
#panel input{
  background:var(--bg);border:1px solid var(--line);color:var(--text);padding:12px 14px;
  border-radius:10px;font-size:15px;outline:none
}
#panel input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(169,230,181,.1)}
.opt{opacity:0;transform:translateY(-8px);animation:in .35s forwards;text-align:start;font-weight:650}
.opt.t1{background:rgba(216,180,90,.10);color:var(--gold-soft);border-color:rgba(216,180,90,.65)}
.opt.t2{background:rgba(169,230,181,.10);color:var(--green);border-color:rgba(169,230,181,.65)}
.opt.t3{background:var(--surface-3);color:var(--text);border-color:var(--line)}
@keyframes in{to{opacity:1;transform:none}}
.note{color:var(--muted);font-size:13px;margin:6px 0 0}
.bar{
  display:flex;align-items:center;justify-content:space-between;margin:30px 0 12px;
  color:var(--green);font-weight:750;gap:10px;flex-wrap:wrap
}
.bar>span:first-child{font-size:15px;letter-spacing:.2px}
.bar .nav{display:flex;align-items:center;gap:10px;color:var(--gold-soft);font-size:13px}
.bar .nav button{
  background:var(--surface);border:1px solid rgba(169,230,181,.5);color:var(--green);
  border-radius:9px;width:34px;height:32px;cursor:pointer;font-size:19px;line-height:1
}
#rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center;margin:0;padding:7px 0}
.lab{
  flex:0 0 32%;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:6px;min-width:0
}
.lab b{color:var(--green);margin-inline-end:6px}
.lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:600}
.lab button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:2px 5px}
.lab button:hover{color:var(--gold)}
.days{
  flex:1;display:flex;justify-content:space-between;background:rgba(20,24,22,.82);
  border:1px solid var(--line);border-radius:999px;padding:6px 9px;gap:5px
}
.d{
  width:clamp(30px,7vw,43px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(216,180,90,.8);
  background:transparent;color:var(--gold-soft);font-weight:700;cursor:pointer;transition:.18s;font-family:inherit
}
.d:hover:not(:disabled){background:rgba(216,180,90,.14);transform:translateY(-1px)}
.d.on{background:var(--gold);border-color:var(--gold);color:#11150f;transform:scale(1.04)}
.d.t2.on{background:var(--green);border-color:var(--green)}
.d.t3.on{background:var(--surface-3);border-color:var(--green);color:var(--green)}
.d.today{box-shadow:0 0 0 3px rgba(169,230,181,.18)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:20px}
.card{
  background:linear-gradient(145deg,rgba(28,33,30,.98),rgba(18,22,20,.98));
  border:1px solid var(--line);border-radius:16px;padding:15px;
  box-shadow:0 10px 28px rgba(0,0,0,.12)
}
.card h4{margin:0 0 8px;color:var(--green);font-size:14px;font-weight:750}
.histogram-card svg{display:block;overflow:visible}.histogram-card .hist-bar{transform-box:fill-box}
svg text{fill:var(--muted);font-size:11px;font-family:inherit}
.scroll{overflow-x:auto}
footer{
  margin-top:38px;border-top:1px solid rgba(216,180,90,.45);padding-top:18px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:13px
}
footer strong{color:var(--gold-soft)}
.langs{display:flex;gap:7px}
.langs button{
  background:var(--surface);color:var(--muted);border:1px solid var(--line);
  border-radius:9px;padding:7px 13px;cursor:pointer;font-size:12px;font-weight:750
}
.langs button.on{border-color:var(--green);color:var(--green);background:rgba(169,230,181,.08)}
.empty{color:var(--muted);text-align:center;padding:26px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.cat-h{
  margin:18px 0 4px;padding:8px 12px;background:rgba(216,180,90,.08);
  border-inline-start:3px solid var(--gold);color:var(--gold-soft);font-weight:750;
  font-size:13px;border-radius:7px
}
.row.out{animation:out .35s forwards}
@keyframes out{to{opacity:0;transform:translateX(-30px)}}
.pbar{height:10px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin:10px 0 8px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:99px;transition:width .4s}
.mini{display:flex;gap:7px;align-items:flex-end;height:72px}
.mini div{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.mini i{display:block;width:100%;background:linear-gradient(180deg,var(--green),rgba(169,230,181,.45));border-radius:5px 5px 0 0;min-height:3px;transition:height .4s}
.d.fut{opacity:.25;cursor:default}
.stats{display:flex;gap:10px;margin:12px 0 2px}
.stat{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px;text-align:center}
.stat small{color:var(--muted);font-size:11px}
.stat p{margin:5px 0 0;font-size:24px;font-weight:800;color:var(--gold-soft)}
#warn{
  display:none;background:rgba(216,180,90,.09)!important;border:1px solid rgba(216,180,90,.5)!important;
  color:var(--gold-soft)!important;border-radius:12px!important;padding:10px!important;font-size:13px!important;margin-top:12px;text-align:center
}
#bkp{margin-top:10px}
#bkt{width:100%;background:var(--bg)!important;color:var(--text)!important;border:1px solid var(--line)!important;border-radius:10px;padding:10px;margin-top:8px}
#reset{color:var(--gold-soft)!important;border-color:rgba(216,180,90,.55)!important}
#bk{border-color:rgba(169,230,181,.5);color:var(--green)}
@media(max-width:650px){
  .wrap{padding:16px 13px 24px}
  header{grid-template-columns:1fr auto;gap:8px;padding:18px 14px}
  header h2:first-child{grid-column:1/-1}
  header h2:last-child{font-size:18px}
  .cap{grid-column:1/-1;grid-row:2;font-size:42px}
  header h2:last-child{grid-column:1/-1}
  .row{flex-direction:column;align-items:stretch;gap:7px}
  .lab{flex:none}
  .days{width:100%;padding:6px;gap:3px}
  .d{width:clamp(31px,10vw,42px)}
  .bar{margin-top:24px}
  .charts{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

</style>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
</head>
<body>
<div class="wrap">
<div class="banner">ABDELHAK FIQHI</div>
<span class="saved" id="saved"></span>
<header>
  <h2 id="hFr">Votre Succès commence ici !</h2>
  <div class="cap">🎓</div>
  <h2 id="hEn">Your Success Starts Here!</h2>
</header>

<div id="warn" style="display:none;background:#3a1020;border:1px solid #ef476f;color:#ffc2dc;border-radius:10px;padding:8px;font-size:13px;margin-top:12px;text-align:center">⚠️ Storage unavailable (private mode?) — use 💾 Backup.</div>
<button class="btn main-btn" id="create"></button>
<div id="panel"></div>

<div class="bar">
  <span id="streakT"></span>
  <span class="nav"><button id="prev">‹</button> <span id="wlabel"></span> <button id="next">›</button></span>
</div>
<div id="rows"></div>
<div class="card" style="margin-top:12px"><div style="display:flex;justify-content:space-between;align-items:baseline"><b id="pct" style="font-size:26px;color:var(--gold)">0%</b><small id="cnt" style="color:var(--mut)"></small></div><div class="pbar"><i id="pfill"></i></div><div class="mini" id="mini"></div></div>

<div class="charts" id="wcharts"></div>

<div class="bar">
  <span id="monthT"></span>
  <span class="nav"><button id="mprev">‹</button> <span id="mlabel"></span> <button id="mnext">›</button></span>
</div>
<div class="card scroll" id="mchart"></div>
<div class="card" style="margin-top:12px"><h4 id="statT"></h4><div class="stats"><div class="stat"><small id="s1l"></small><p id="s1">0</p></div><div class="stat"><small id="s2l"></small><p id="s2">0%</p></div></div><div id="donut"></div></div>
<button class="btn main-btn" id="reset" style="font-size:15px"></button>
<button class="btn main-btn" id="bk" style="font-size:15px"></button>
<div id="bkp" style="display:none"><textarea id="bkt" rows="5" style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px"></textarea><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" id="bke" style="flex:1"></button><button class="btn" id="bki" style="flex:1"></button></div></div>

<footer>
  <div>Created by <strong>ABDELHAK FIQHI</strong><br>All rights reserved © 2026.</div>
  <div class="langs"><button data-l="ar">AR</button><button data-l="fr">FR</button><button data-l="en">EN</button></div>
</footer>
</div>

<script>
const T={
 fr:{create:"Créer de nouvelles choses",t1:"Étude / Examens / Exercices",t2:"Habitudes / Apprendre des compétences",t3:"Objectif personnel",ph:"Nom (facultatif)",streak:"Série de la semaine",month:"Somme mensuelle",week:"Semaine",inf:"Nombre de * = ∞ « infini » — de ** = ∞ — de *** = ∞",empty:"Rien encore. Clique sur « Créer de nouvelles choses ».",n:"Nombre de",days:"Jours de la semaine",def:["Étude","Habitude","Objectif"]},
 en:{create:"Create new things",t1:"Study / Exams / Exercises",t2:"Habits / Learn Skills",t3:"Personal Goal",ph:"Name (optional)",streak:"Streak week",month:"Monthly sum",week:"Week",inf:"Number of * = ∞ “infinite” — of ** = ∞ — of *** = ∞",empty:"Nothing yet. Click “Create new things”.",n:"Number of",days:"Week days",def:["Study","Habit","Goal"]},
 ar:{create:"إنشاء أشياء جديدة",t1:"الدراسة / الامتحانات / التمارين",t2:"العادات / تعلم المهارات",t3:"هدف شخصي",ph:"الاسم (اختياري)",streak:"سلسلة الأسبوع",month:"المجموع الشهري",week:"الأسبوع",inf:"عدد * = ∞ «لا نهاية» — عدد ** = ∞ — عدد *** = ∞",empty:"لا شيء بعد. اضغط على «إنشاء أشياء جديدة».",n:"عدد",days:"أيام الأسبوع",def:["دراسة","عادة","هدف"]}
};
const COL=["#d8b45a","#a9e6b5","#c7ceca"];
const X={
 fr:{stat:"📊 Domination par catégorie",tot:"Total validé",rate:"Réussite",reset:"Réinitialiser le mois",conf:"Confirmer ? (clique encore)",cat:["📚 Études & Examens","⚡ Habitudes & Compétences","🎯 Objectifs perso"],saved:"● Sauvegardé auto"},
 en:{stat:"📊 Domination by category",tot:"Total done",rate:"Success rate",reset:"Reset the month",conf:"Confirm? (click again)",cat:["📚 Study & Exams","⚡ Habits & Skills","🎯 Personal goals"],saved:"● Auto-saved"},
 ar:{stat:"📊 الهيمنة حسب الفئة",tot:"المجموع المنجز",rate:"نسبة النجاح",reset:"إعادة تعيين الشهر",conf:"تأكيد؟ (اضغط مرة أخرى)",cat:["📚 الدراسة والامتحانات","⚡ العادات والمهارات","🎯 أهداف شخصية"],saved:"● حفظ تلقائي"}
};
for(const l in X)X[l].cat=[1,2,3].map(t=>T[l]["t"+t]);
function streak(id){let d=new Date();d.setHours(0,0,0,0);let n=0;if(!S.checks[id+"|"+key(d)])d.setDate(d.getDate()-1);while(S.checks[id+"|"+key(d)]){n++;d.setDate(d.getDate()-1)}return n}
function weekSum(dates){
 const n=S.items.length;let tot=0;
 const per=dates.map(d=>{const c=S.items.filter(i=>S.checks[i.id+"|"+key(d)]).length;tot+=c;return c});
 const poss=n*7,pc=Math.round(tot/Math.max(poss,1)*100);
 $("pct").textContent=pc+"%";$("cnt").textContent=tot+" / "+poss;$("pfill").style.width=pc+"%";
 $("mini").innerHTML=dates.map((d,i)=>`<div><i style="height:${Math.round(per[i]/Math.max(n,1)*50)+3}px"></i>${dletter(d)}</div>`).join("");
}
function monthPrefix(){const n=new Date(),d=new Date(n.getFullYear(),n.getMonth()+mOff,1);return{d,p:d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"}}
function stats(){
 const L=X[S.lang],{d,p}=monthPrefix();
 const c=[0,0,0];let tot=0;
 S.items.forEach(it=>{Object.keys(S.checks).forEach(k=>{if(k.startsWith(it.id+"|"+p)){c[it.t-1]++;tot++}})});
 const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
 const B={fr:["💾 Sauvegarde","Exporter","Importer"],en:["💾 Backup","Export","Import"],ar:["💾 نسخة احتياطية","تصدير","استيراد"]}[S.lang];$("bk").textContent=B[0];$("bke").textContent=B[1];$("bki").textContent=B[2];
 $("statT").textContent=L.stat;$("s1l").textContent=L.tot;$("s2l").textContent=L.rate;$("reset").textContent=L.reset;$("saved").textContent=L.saved;
 $("s1").textContent=tot;$("s2").textContent=Math.round(tot/Math.max(S.items.length*dim,1)*100)+"%";
 const sum=c[0]+c[1]+c[2],R=40,C=2*Math.PI*R;let a=0,g="";
 if(sum){c.forEach((v,i)=>{const len=v/sum*C;g+=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${COL[i]}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-a}" transform="rotate(-90 60 60)"/>`;a+=len})}
 else g=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="#2a2a2a" stroke-width="16"/>`;
 $("donut").innerHTML=`<div style="display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap"><svg viewBox="0 0 120 120" width="130">${g}</svg><div>${c.map((v,i)=>`<div style="color:${COL[i]}">● ${L.cat[i]} : ${v}</div>`).join("")}</div></div>`;
}
const ML=[31,28,31,30,31,30,31,31,30,31,30,31];
let S={items:[],checks:{},lang:"fr"};
try{const s=JSON.parse(localStorage.getItem("succ")||"null");if(s)S=s}catch(e){document.getElementById("warn").style.display="block"}
const save=()=>{try{localStorage.setItem("succ",JSON.stringify(S))}catch(e){document.getElementById("warn").style.display="block"}const e=document.getElementById("saved");if(e){e.style.opacity=1;setTimeout(()=>e.style.opacity=.5,800)}};
let wOff=0,mOff=0;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function weekDates(){const n=new Date();const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()+wOff*7);const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return[...Array(7)].map((_,i)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+i))}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
const loc=()=>({fr:"fr-FR",en:"en-US",ar:"ar-MA"}[S.lang]);
const mname=d=>new Intl.DateTimeFormat(loc(),{month:"long",year:"numeric"}).format(d);
const dletter=d=>new Intl.DateTimeFormat(loc(),{weekday:"narrow"}).format(d);
const stars=t=>"*".repeat(t);

function drawPanel(){
 const L=T[S.lang],p=$("panel");
 p.innerHTML=`<input id="nm" placeholder="${L.ph}" maxlength="40">`+[1,2,3].map(t=>`<button class="btn opt t${t}" style="animation-delay:${(t-1)*.25}s" data-t="${t}">${L["t"+t]}</button>`).join("");
 p.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  const t=+b.dataset.t;const nm=$("nm").value.trim()||L.def[t-1]+" "+(S.items.filter(i=>i.t===t).length+1);
  S.items.push({id:Date.now()+Math.random(),t,nm});$("nm").value="";save();render();$("nm").focus();
 });
}
function toggle(id,k){const kk=id+"|"+k;if(S.checks[kk])delete S.checks[kk];else S.checks[kk]=1;save();render()}
function del(id){const r=document.querySelector('[data-row="'+id+'"]');const go=()=>{S.items=S.items.filter(i=>i.id!==id);save();render()};if(r){r.classList.add("out");setTimeout(go,350)}else go()}

function histogramChart(t,dates){
  const items=S.items.filter(i=>i.t===t);
  const vals=dates.map(d=>items.filter(i=>S.checks[i.id+"|"+key(d)]).length);
  const actualMax=Math.max(...vals,0);
  const max=Math.max(4,Math.ceil(actualMax/2)*2);
  const ticks=max<=4?[0,1,2,3,4]:[0,max/4,max/2,3*max/4,max].map(v=>Math.round(v));
  const W=320,H=190,l=34,b=32,top=15,r=10;
  const plotH=H-b-top,plotW=W-l-r;
  const slot=plotW/7,barW=Math.min(22,slot*.58);
  const y=v=>H-b-(v/max)*plotH;
  let g="";
  ticks.forEach(v=>{
    const yy=y(v);
    g+=`<line x1="${l}" y1="${yy}" x2="${W-r}" y2="${yy}" stroke="#39423c" stroke-width="1" stroke-dasharray="3 4"/>`;
    g+=`<text x="${l-8}" y="${yy+4}" text-anchor="end">${v}</text>`;
  });
  g+=`<line x1="${l}" y1="${top}" x2="${l}" y2="${H-b}" stroke="#78827a"/>`;
  g+=`<line x1="${l}" y1="${H-b}" x2="${W-r}" y2="${H-b}" stroke="#78827a"/>`;
  vals.forEach((v,i)=>{
    const x=l+i*slot+(slot-barW)/2;
    const h=(v/max)*plotH;
    const yy=H-b-h;
    g+=`<rect class="hist-bar" data-value="${v}" x="${x}" y="${yy}" width="${barW}" height="${Math.max(h,0)}" rx="4" fill="${COL[t-1]}" opacity=".94"/>`;
    if(v>0)g+=`<text x="${x+barW/2}" y="${Math.max(top+10,yy-6)}" text-anchor="middle" fill="#f1f3f0">${v}</text>`;
    g+=`<text x="${x+barW/2}" y="${H-10}" text-anchor="middle">${dletter(dates[i])}</text>`;
  });
  return `<div class="card histogram-card"><h4>${T[S.lang]["t"+t]}</h4><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${T[S.lang]["t"+t]} histogram, vertical axis shows number completed">${g}</svg></div>`;
}

function monthChart(){
 const n=new Date(),d=new Date(n.getFullYear(),n.getMonth()+mOff,1);
 const y=d.getFullYear(),m=d.getMonth();
 const leap=(y%4===0&&y%100!==0)||y%400===0;
 const days=(m===1&&leap)?29:ML[m];
 const data=[];let max=1;
 for(let i=1;i<=days;i++){
  const k=y+"-"+pad(m+1)+"-"+pad(i);
  const c=[1,2,3].map(t=>S.items.filter(it=>it.t===t&&S.checks[it.id+"|"+k]).length);
  max=Math.max(max,...c);data.push(c);
 }
 const gw=26,l=30,H=200,b=26,top=10,W=l+days*gw+10;
 const yy=v=>H-b-(v/max)*(H-b-top);
 let g=`<line x1="${l}" y1="${top}" x2="${l}" y2="${H-b}" stroke="#555"/><line x1="${l}" y1="${H-b}" x2="${W}" y2="${H-b}" stroke="#555"/><text x="4" y="${yy(max)+4}">${max}</text><text x="4" y="${H-b+4}">0</text>`;
 data.forEach((c,i)=>{
  const x0=l+i*gw+3;
  c.forEach((v,j)=>{if(v)g+=`<rect x="${x0+j*7}" y="${yy(v)}" width="6" height="${H-b-yy(v)}" fill="${COL[j]}" rx="1"/>`});
  g+=`<text x="${x0+10}" y="${H-10}" text-anchor="middle">${i+1}</text>`;
 });
 $("mlabel").textContent=mname(d);
 $("mchart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${g}</svg>`;
}

function animateWithGSAP(){
  if(!window.gsap)return;
  gsap.fromTo(".histogram-card",{y:14,opacity:.65},{y:0,opacity:1,duration:.45,stagger:.08,ease:"power2.out",overwrite:true});
  gsap.fromTo(".hist-bar",{scaleY:0,transformOrigin:"50% 100%"},{scaleY:1,duration:.55,stagger:.035,ease:"back.out(1.4)",overwrite:true});
  gsap.fromTo(".pbar i",{scaleX:.92,transformOrigin:"left center"},{scaleX:1,duration:.5,ease:"power2.out",overwrite:true});
}
function render(){
 const L=T[S.lang];
 document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
 $("create").textContent="✨ "+L.create;
 $("streakT").textContent=L.streak+" · "+L.week;
 $("monthT").textContent=L.month;
 const dates=weekDates();
 $("wlabel").textContent=mname(dates[3])+" · "+L.week+" "+isoWeek(dates[0]);
 const today=key(new Date());
 $("rows").innerHTML=S.items.length?[1,2,3].map(t=>S.items.filter(i=>i.t===t).length?`<div class="cat-h">${X[S.lang].cat[t-1]}</div>`+S.items.filter(i=>i.t===t).map(it=>`<div class="row" data-row="${it.id}"><div class="lab"><span>${it.nm.replace(/</g,"&lt;")}${streak(it.id)?` <small style="color:var(--gold)">🔥${streak(it.id)}</small>`:""}</span><button data-del="${it.id}" title="×">×</button></div><div class="days">${dates.map(d=>{const k=key(d);return`<button class="d t${it.t} ${S.checks[it.id+"|"+k]?"on":""} ${k===today?"today":""} ${k>today?"fut":""}" ${k>today?"disabled":""} data-id="${it.id}" data-k="${k}">${dletter(d)}</button>`}).join("")}</div></div>`).join(""):"").join(""):`<div class="empty">${L.empty}</div>`;
 $("rows").querySelectorAll(".d").forEach(b=>b.onclick=()=>toggle(b.dataset.id,b.dataset.k));
 $("rows").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>del(+b.dataset.del));
 $("wcharts").innerHTML=[1,2,3].map(t=>histogramChart(t,dates)).join("");
 monthChart();stats();weekSum(dates);
 drawPanelLabels();
 document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on",b.dataset.l===S.lang));
}
function drawPanelLabels(){const L=T[S.lang];document.querySelectorAll("#panel .opt").forEach(b=>b.textContent=L["t"+b.dataset.t]+"  ·  "+S.items.filter(i=>i.t===+b.dataset.t).length);const i=$("nm");if(i)i.placeholder=L.ph}

$("create").onclick=()=>{const p=$("panel");if(p.classList.contains("open")){p.classList.remove("open")}else{drawPanel();drawPanelLabels();p.classList.add("open")}};
$("prev").onclick=()=>{wOff--;render()};$("next").onclick=()=>{wOff++;render()};
$("bk").onclick=()=>{const b=$("bkp");b.style.display=b.style.display==="none"?"block":"none"};
$("bke").onclick=()=>{const t=JSON.stringify(S);$("bkt").value=t;$("bkt").select();try{navigator.clipboard.writeText(t)}catch(e){}};
$("bki").onclick=()=>{try{const o=JSON.parse($("bkt").value);if(o&&Array.isArray(o.items)&&o.checks){S=o;save();render()}}catch(e){$("bkt").value="⚠️ Invalid JSON"}};
let armed=0;
$("reset").onclick=()=>{
 if(!armed){armed=1;$("reset").textContent=X[S.lang].conf;setTimeout(()=>{armed=0;stats()},4000);return}
 armed=0;const {p}=monthPrefix();
 Object.keys(S.checks).forEach(k=>{if(k.split("|")[1].startsWith(p))delete S.checks[k]});
 save();render();
};
$("mprev").onclick=()=>{mOff--;render()};$("mnext").onclick=()=>{mOff++;render()};
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;save();render()});
render();
</script>
</body>
